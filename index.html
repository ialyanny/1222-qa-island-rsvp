<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12/22 QA Q4 高雄島語聚餐報名</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #1e3a8a; --primary-light: #2563eb; --bg: #f3f4f6;
            --card: #ffffff; --text: #1f2937; --muted: #6b7280;
            --border: #e5e7eb; --success: #059669; --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px 15px; line-height: 1.6; }
        .container { max-width: 760px; margin: 0 auto; }
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white; border-radius: 16px; padding: 28px 24px; margin-bottom: 18px;
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.2);
        }
        .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge {
            background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 4px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 600;
        }
        .conn-dot { font-size: 0.8rem; color: #a7f3d0; }
        .hero h1 { font-size: 1.6rem; margin-bottom: 12px; }
        .info-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;
            background: rgba(255, 255, 255, 0.08); padding: 14px 16px; border-radius: 12px; font-size: 0.92rem;
        }
        .info-item span { color: #93c5fd; font-weight: 500; margin-right: 6px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; border: none; border-radius: 12px; background: #e5e7eb;
            color: var(--muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2); }
        .card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
        .req { color: var(--danger); margin-left: 4px; }
        input[type="text"], input[type="number"], textarea {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem;
        }
        .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .radio-card {
            border: 2px solid var(--border); border-radius: 12px; padding: 14px;
            text-align: center; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .radio-card input { display: none; }
        .radio-card.selected-yes { border-color: var(--success); background: #ecfdf5; color: var(--success); }
        .radio-card.selected-no { border-color: var(--danger); background: #fef2f2; color: var(--danger); }
        .guest-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 16px; margin-bottom: 18px; }
        .guest-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-submit {
            width: 100%; padding: 14px; background: var(--primary-light); color: white;
            border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
        }
        .btn-submit:disabled { background: #9ca3af; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        @media (min-width: 540px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
        .stat-card { background: #f8fafc; border: 1px solid var(--border); padding: 14px; border-radius: 12px; text-align: center; }
        .stat-card.highlight { background: #eff6ff; border-color: #bfdbfe; }
        .stat-label { font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
        .stat-val { font-size: 1.55rem; font-weight: 800; color: var(--primary); }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: #f9fafb; color: var(--muted); }
        .tag-yes { background: #d1fae5; color: #065f46; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; }
        .tag-no { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; }
        .admin-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .btn-outline { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
        .btn-del { color: var(--danger); border: none; background: none; cursor: pointer; font-weight: 600; }
        .hidden { display: none; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #111827; color: white; padding: 12px 24px; border-radius: 999px; font-weight: 600; z-index: 999;
        }

        /* ---------- 手機優化 (≤560px) ---------- */
        @media (max-width: 560px) {
            body { padding: 12px 10px; }
            .hero { padding: 20px 16px; border-radius: 14px; }
            .hero h1 { font-size: 1.3rem; }
            .badge-row { flex-wrap: wrap; gap: 6px; }
            .info-grid { font-size: 0.85rem; padding: 12px; }
            .card { padding: 18px 14px; border-radius: 14px; }
            .tab-btn { padding: 14px 8px; font-size: 0.88rem; min-height: 48px; }
            .radio-card { padding: 16px 10px; }
            .guest-row { grid-template-columns: 1fr; }
            .btn-submit { padding: 16px; min-height: 52px; }
            .admin-actions .btn-outline { flex: 1 1 100%; padding: 12px; text-align: center; }
            .stat-val { font-size: 1.3rem; }
            .toast { max-width: calc(100vw - 32px); text-align: center; }

            /* 統計表 → 卡片式，免左右滑 */
            .table-wrap { overflow-x: visible; }
            table thead { display: none; }
            table, table tbody, table tr, table td { display: block; width: 100%; }
            table tr { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; padding: 8px 4px; background: #fff; }
            table td { border-bottom: none; padding: 5px 12px; font-size: 0.92rem; }
            table td[data-label] { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
            table td[data-label]::before {
                content: attr(data-label); color: var(--muted); font-size: 0.8rem; font-weight: 600; flex-shrink: 0;
            }
            table td.cell-name { font-size: 1.05rem; }
            table td.cell-del { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 8px; text-align: right; }
            .btn-del { padding: 10px 14px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <div class="badge-row">
            <div class="badge">QA C、D組 Q3、4 聚餐活動</div>
            <div class="conn-dot" id="connStatus">🟢 雲端同步連線中</div>
        </div>
        <h1>12/22 高雄島語自助餐廳 報名統計</h1>
        <div class="info-grid">
            <div class="info-item"><span>日期：</span>2026/12/22 (週二)</div>
            <div class="info-item"><span>餐期：</span>平日午餐 (11:30 - 14:30 / 無下午茶清場)</div>
            <div class="info-item"><span>地點：</span>高雄漢神百貨 8F (島語)</div>
            <div class="info-item"><span>參考餐費：</span>$1,490 + 10% ($1,639/人)</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabFormBtn" onclick="switchTab('form')">我要登記 / 修改</button>
        <button class="tab-btn" id="tabAdminBtn" onclick="switchTab('admin')">目前報名統計 (<span id="navCount">0</span>)</button>
    </div>

    <!-- 報名表單 -->
    <div id="formSection" class="card">
        <form id="regForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label>員工姓名 / 暱稱<span class="req">*</span> <small style="font-weight:normal;color:#6b7280;">(輸入相同姓名送出，可直接覆蓋更新紀錄)</small></label>
                <input type="text" id="empName" placeholder="請輸入您的姓名" required>
            </div>

            <div class="form-group">
                <label>是否參加本次 12/22 QA Q4 聚餐？<span class="req">*</span></label>
                <div class="radio-group">
                    <label class="radio-card selected-yes" id="cardYes" onclick="setAttend('yes')">
                        <input type="radio" name="attend" value="參加" checked> ⭕ 參加
                    </label>
                    <label class="radio-card" id="cardNo" onclick="setAttend('no')">
                        <input type="radio" name="attend" value="不克參加"> ❌ 不克參加
                    </label>
                </div>
            </div>

            <div id="guestSection" class="guest-box">
                <label style="margin-bottom: 10px; color: #1e3a8a;">攜伴人數登記 (不含同仁本人)</label>
                <div class="guest-row">
                    <div>
                        <label style="font-size: 0.85rem; color: #4b5563;">攜伴大人 (位)</label>
                        <input type="number" id="guestAdult" min="0" max="10" value="0" onchange="updateTotalPreview()">
                    </div>
                    <div>
                        <label style="font-size: 0.85rem; color: #4b5563;">攜伴兒童 / 需兒童椅 (位)</label>
                        <input type="number" id="guestChild" min="0" max="10" value="0" onchange="updateTotalPreview()">
                    </div>
                </div>
                <p id="totalPreview" style="margin-top: 12px; font-size: 0.9rem; font-weight: 600; color: #059669;">
                    👉 您這組共計出席：1 位 (本人 1 位 + 攜伴大人 0 位 + 兒童 0 位)
                </p>
            </div>

            <div class="form-group">
                <label>備註事項 (選填)</label>
                <textarea id="note" rows="2" placeholder="例如：需要1張兒童座椅、素食需求、或晚到說明..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">送出登記資料</button>
        </form>
    </div>

    <!-- 後台統計區 -->
    <div id="adminSection" class="card hidden">
        <div class="stats-grid">
            <div class="stat-card highlight">
                <div class="stat-label">預訂總人數 (含攜伴)</div>
                <div class="stat-val" id="statTotalSeat">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">參加同仁數</div>
                <div class="stat-val" id="statStaffYes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">攜伴總數 (大/小)</div>
                <div class="stat-val" id="statGuestTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">不克參加同仁</div>
                <div class="stat-val" id="statStaffNo" style="color: #dc2626;">0</div>
            </div>
        </div>

        <div class="admin-actions">
            <button class="btn-outline" onclick="fetchRecords()">🔄 重新整理</button>
            <button class="btn-outline" onclick="exportCSV()">📥 匯出 Excel (CSV)</button>
            <button class="btn-outline" onclick="copySummary()">📋 複製統計文字報表 (貼LINE群組)</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>狀態</th>
                        <th>攜伴(大/小)</th>
                        <th>合計座位</th>
                        <th>備註</th>
                        <th>更新時間</th>
                        <th>管理</th>
                    </tr>
                </thead>
                <tbody id="recordTableBody">
                    <tr><td colspan="7" style="text-align:center;color:#9ca3af;padding:20px;">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden">已儲存！</div>

<script>
    const SUPABASE_URL = "https://nutkocotbncqxgvjkfxi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51dGtvY290Ym5jcXhndmprZnhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTcwMjcsImV4cCI6MjEwMTQzMzAyN30.yfvXV2dvYhS8cTLgyir-ddaVb5oqbYIDyjngINVccfE";
    const ADMIN_PIN = "1222"; // 刪除紀錄時的管理員驗證碼 (預設為活動日期 1222，可自行修改)
    const TABLE_NAME = "qa_q4_island_rsvp";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let cachedRecords = [];
    let currentAttend = '參加';

    async function fetchRecords() {
        const { data, error } = await supabaseClient
            .from(TABLE_NAME)
            .select('*')
            .order('updated_at', { ascending: false });

        if (error) {
            document.getElementById('connStatus').innerText = '🔴 資料庫未連線';
            return;
        }
        document.getElementById('connStatus').innerText = '🟢 雲端即時同步中';
        cachedRecords = data || [];
        renderTable(cachedRecords);
    }

    async function handleSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = '雲端同步中...';

        const emp_name = document.getElementById('empName').value.trim();
        const attend_status = currentAttend;
        const guest_adult = attend_status === '參加' ? parseInt(document.getElementById('guestAdult').value || 0, 10) : 0;
        const guest_child = attend_status === '參加' ? parseInt(document.getElementById('guestChild').value || 0, 10) : 0;
        const total_seats = attend_status === '參加' ? (1 + guest_adult + guest_child) : 0;
        const note = document.getElementById('note').value.trim();

        const { error } = await supabaseClient
            .from(TABLE_NAME)
            .upsert({
                emp_name, attend_status, guest_adult, guest_child, total_seats, note,
                updated_at: new Date().toISOString()
            }, { onConflict: 'emp_name' });

        btn.disabled = false;
        btn.innerText = '送出登記資料';

        if (error) {
            showToast('送出失敗：' + error.message);
            return;
        }
        showToast(`✅ 「${emp_name}」報名資料已送出！`);
        document.getElementById('regForm').reset();
        setAttend('yes');
        fetchRecords();
    }

    async function deleteRecord(id, name) {
        const pin = prompt(`請輸入管理員密碼以刪除「${name}」的紀錄：`);
        if (pin === null) return;
        if (pin !== ADMIN_PIN) {
            showToast('❌ 管理員密碼錯誤，無法刪除！');
            return;
        }
        const { error } = await supabaseClient.from(TABLE_NAME).delete().eq('id', id);
        if (!error) {
            showToast(`🗑️ 已刪除 ${name} 的紀錄`);
            fetchRecords();
        }
    }

    function renderTable(records) {
        document.getElementById('navCount').innerText = records.length;
        let totalSeat = 0, staffYes = 0, staffNo = 0, guestAdult = 0, guestChild = 0;
        const tbody = document.getElementById('recordTableBody');
        tbody.innerHTML = '';

        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#9ca3af;padding:20px;">目前尚無報名資料</td></tr>';
        }

        records.forEach(r => {
            if (r.attend_status === '參加') {
                staffYes++;
                guestAdult += (r.guest_adult || 0);
                guestChild += (r.guest_child || 0);
                totalSeat += (r.total_seats || 0);
            } else {
                staffNo++;
            }
            const d = r.updated_at ? new Date(r.updated_at) : new Date();
            const timeStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="cell-name" data-label="姓名"><strong>${escapeHtml(r.emp_name)}</strong></td>
                <td data-label="狀態"><span class="${r.attend_status === '參加' ? 'tag-yes' : 'tag-no'}">${r.attend_status}</span></td>
                <td data-label="攜伴">${r.attend_status === '參加' ? `${r.guest_adult} 大 / ${r.guest_child} 小` : '-'}</td>
                <td data-label="合計"><strong>${r.total_seats}</strong> 位</td>
                <td data-label="備註">${escapeHtml(r.note || '-')}</td>
                <td data-label="更新" style="color:#6b7280;font-size:0.8rem;">${timeStr}</td>
                <td class="cell-del"><button class="btn-del" onclick="deleteRecord(${r.id}, '${escapeHtml(r.emp_name)}')">刪除</button></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('statTotalSeat').innerText = totalSeat;
        document.getElementById('statStaffYes').innerText = staffYes;
        document.getElementById('statGuestTotal').innerText = `${guestAdult + guestChild} (${guestAdult}/${guestChild})`;
        document.getElementById('statStaffNo').innerText = staffNo;
    }

    function switchTab(tab) {
        document.getElementById('formSection').classList.toggle('hidden', tab !== 'form');
        document.getElementById('adminSection').classList.toggle('hidden', tab !== 'admin');
        document.getElementById('tabFormBtn').classList.toggle('active', tab === 'form');
        document.getElementById('tabAdminBtn').classList.toggle('active', tab === 'admin');
        if (tab === 'admin') fetchRecords();
    }

    function setAttend(type) {
        currentAttend = (type === 'yes') ? '參加' : '不克參加';
        document.getElementById('cardYes').className = 'radio-card ' + (type === 'yes' ? 'selected-yes' : '');
        document.getElementById('cardNo').className = 'radio-card ' + (type === 'no' ? 'selected-no' : '');
        document.getElementById('guestSection').classList.toggle('hidden', type === 'no');
        if (type === 'no') {
            document.getElementById('guestAdult').value = 0;
            document.getElementById('guestChild').value = 0;
        }
        updateTotalPreview();
    }

    function updateTotalPreview() {
        const adult = parseInt(document.getElementById('guestAdult').value || 0, 10);
        const child = parseInt(document.getElementById('guestChild').value || 0, 10);
        document.getElementById('totalPreview').innerText =
            `👉 您這組共計出席：${1 + adult + child} 位 (本人 1 位 + 攜伴大人 ${adult} 位 + 兒童 ${child} 位)`;
    }

    function exportCSV() {
        if (!cachedRecords.length) { showToast('目前無資料可匯出'); return; }
        let csv = '\uFEFF姓名,是否參加,攜伴大人,攜伴兒童,該組總人數,備註,更新時間\n';
        cachedRecords.forEach(r => {
            csv += `"${r.emp_name}","${r.attend_status}",${r.guest_adult},${r.guest_child},${r.total_seats},"${(r.note||'').replace(/"/g,'""')}","${r.updated_at}"\n`;
        });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = '1222_QA_Q4_高雄島語報名統計.csv';
        link.click();
    }

    function copySummary() {
        const yesList = cachedRecords.filter(r => r.attend_status === '參加');
        const noList = cachedRecords.filter(r => r.attend_status !== '參加');
        const totalSeat = yesList.reduce((acc, r) => acc + (r.total_seats || 0), 0);
        const totalGuest = yesList.reduce((acc, r) => acc + (r.guest_adult || 0) + (r.guest_child || 0), 0);

        let text = `【12/22 (二) QA Q4 高雄島語聚餐 報名統計】\n`;
        text += `📊 預訂總人數：${totalSeat} 位 (同仁 ${yesList.length} 位 + 攜伴 ${totalGuest} 位)\n`;
        text += `------------------------\n⭕ 參加名單 (${yesList.length}組)：\n`;
        yesList.forEach(r => {
            const g = (r.guest_adult || 0) + (r.guest_child || 0);
            text += `• ${r.emp_name}${g > 0 ? ` (攜伴: ${r.guest_adult}大${r.guest_child}小，共${r.total_seats}位)` : ' (1位)'}${r.note ? ` [備註: ${r.note}]` : ''}\n`;
        });
        if (noList.length) text += `\n❌ 不克參加 (${noList.length}位)：${noList.map(r => r.emp_name).join('、')}\n`;
        navigator.clipboard.writeText(text).then(() => showToast('已複製統計文字，可直接貼上群組！'));
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.remove('hidden');
        setTimeout(() => t.classList.add('hidden'), 2800);
    }

    supabaseClient.channel('public:' + TABLE_NAME)
        .on('postgres_changes', { event: '*', schema: 'public', table: TABLE_NAME }, () => fetchRecords())
        .subscribe();

    fetchRecords();
</script>
</body>
</html>
